<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión — Quejas y denuncias</title>
  <link rel="stylesheet" href="css/naucalpan-tokens.css?v=20261110f">
  <link rel="stylesheet" href="css/quejas.css?v=20261110f">
  <style id="titulo-institucional">
    html body h1, html body .hero h1, html body main h1, html body h1.titulo-institucional {
      color: #7E1520 !important;
    }
  </style>
</head>
<body class="nau-quejas">
  <a class="skip-link" href="#contenido-principal">Saltar al contenido principal</a>
  <div class="topbar">
    <div class="container topbar__inner">
      <p>Revisión de quejas y denuncias</p>
      <a href="index.html">Registro ciudadano</a>
    </div>
  </div>
  <div class="site-header-sticky">
    <header class="header">
      <div class="container brand">
        <div class="logo-row">
          <a class="logo-main" href="https://naucalpan.gob.mx/">
            <img src="https://naucalpan.gob.mx/wp-content/uploads/2024/12/logo-n-2.png" width="210" height="79" alt="Naucalpan de Juárez">
          </a>
        </div>
        <div class="header-label">
          <strong>Quejas y denuncias</strong>
          <span>Personal municipal</span>
        </div>
      </div>
    </header>
  </div>
  <main id="contenido-principal" class="login-shell">
    <div class="login-card">
      <h1 class="titulo-institucional" style="color:#7E1520 !important">Iniciar sesión</h1>
      <p class="lead">Sistema de quejas y denuncias</p>
      <div id="login-status" class="error-summary" hidden tabindex="-1"></div>
      <form id="login-form" method="post" novalidate>
        <p>
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" required autocomplete="username">
        </p>
        <p>
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </p>
        <p class="actions" style="border:0;padding-top:8px">
          <button type="submit" class="btn btn-primary">Entrar</button>
        </p>
      </form>
      <p class="hint">Demostración: revision@naucalpan.gob.mx / Quejas2026</p>
    </div>
  </main>
  <script src="js/store.js?v=20261110f"></script>
  <script src="js/login.js?v=20261110f"></script>
</body>
</html>
